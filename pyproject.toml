[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "task-mcp"
version = "1.0.0"
description = "Opt-in local task workflows and audit history over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[project.scripts]
task-mcp = "task_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/task_mcp"]
artifacts = ["src/task_mcp/reference_skills/*/SKILL.md"]
