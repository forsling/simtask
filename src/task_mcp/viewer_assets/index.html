<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Tasks</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" aria-label="Projects">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <span>Tasks</span>
          <span class="live" title="Local viewer on 127.0.0.1">local</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot">
          <button id="stop" class="link" type="button">Stop viewer</button>
          <span class="hint"><kbd>/</kbd> search · <kbd>j</kbd><kbd>k</kbd> move</span>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <section class="list-pane" aria-label="Task list">
        <header class="list-head">
          <button id="menu" class="icon-btn only-mobile" type="button" aria-label="Open projects"></button>
          <div class="list-title">
            <h1 id="heading">Tasks</h1>
            <p id="subheading"></p>
          </div>
          <button id="refresh" class="icon-btn" type="button" aria-label="Refresh" title="Refresh"></button>
        </header>
        <div id="notes" class="notes" aria-label="Notes" hidden></div>
        <label class="search">
          <span id="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Search" aria-label="Search task titles" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <div id="list" class="list" role="list"></div>
        <p id="drop-hint" class="drop-hint" role="status" aria-live="polite" hidden></p>
      </section>

      <main class="detail-pane" id="detail" aria-live="polite"></main>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="popover" class="popover" role="menu" hidden></div>

    <dialog id="dialog">
      <form id="form">
        <header>
          <h2 id="dialog-title"></h2>
          <button type="button" id="close" class="icon-btn" aria-label="Close"></button>
        </header>
        <p id="dialog-description"></p>
        <div id="fields" class="fields"></div>
        <p id="form-error" class="form-error" role="alert"></p>
        <div id="conflict"></div>
        <footer>
          <button type="button" id="cancel" class="btn">Cancel</button>
          <button id="submit" class="btn primary" type="submit">Save</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
